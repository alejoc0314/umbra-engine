name: feature
stages:
  - name: plan
    profile: planner
  - name: design      # solo si el plan dice que toca la interfaz y hay perfil «designer»
    profile: designer # (no viene con umbra: lo trae un paquete, umbra pack sync)
    critic: design-critic   # mira las pantallas con una rúbrica y lo devuelve a corregir
    block_on: medium
    max_fix_cycles: 2
  - name: build
    profile: builder-tdd
    max_fix_cycles: 2
    escalation: [builder-strong]   # si agota los ciclos, sigue un perfil más fuerte
  - name: review
    profile: reviewer-strict
    fallback_profile: reviewer-claude   # si Codex falla (modelo saturado), revisa Claude
    arbiter: arbiter                    # tras agotar ciclos, un tercer agente decide
    block_on: high
    max_fix_cycles: 2
  - name: verify
    profile: verifier
    block_on: high
    max_fix_cycles: 2
  - name: scan
    block_on: high
    max_fix_cycles: 2
  - name: ship
    human_approval: true
