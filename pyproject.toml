[project]
name = "umbra-engine"
dynamic = ["version"]
description = "Orquestador de agentes de IA 100% de terminal"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "textual>=8.0",
    "pymysql>=1.1",
]

[project.urls]
Repository = "https://github.com/alejoc0314/umbra-engine"
Issues = "https://github.com/alejoc0314/umbra-engine/issues"
Changelog = "https://github.com/alejoc0314/umbra-engine/blob/main/CHANGELOG.md"

[project.scripts]
umbra = "umbra.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-textual-snapshot==1.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "syrupy>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/umbra/__init__.py"  # una sola fuente de la versión

[tool.hatch.build.targets.wheel]
packages = ["src/umbra"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".umbra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests", "sandbox"]
pythonpath = ["."]
norecursedirs = ["fakes"]
# ponytail: en paralelo; la suite es casi toda de aceptación con procesos reales (~5 min en serie)
addopts = "-n auto"
