name: ci

# En cada PR, lo rápido (lint + tests unitarios, ~2 min). La suite completa (~12 min en el runner)
# se corre en local antes de integrar o aquí a mano: Actions → ci → Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      completa:
        description: Correr también los tests de aceptación
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest  # ponytail: solo Windows, que es donde se usa hoy; sumar ubuntu/macos cuando pasen ahí
    timeout-minutes: 30
    env:  # los tests crean repos y commits: el runner no trae identidad de git
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - run: tzutil /s "SA Pacific Standard Time"  # las capturas de watch muestran la hora local (-05:00)
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q -n auto tests/unit
      - if: ${{ inputs.completa }}
        run: uv run pytest -q -n auto tests/acceptance
